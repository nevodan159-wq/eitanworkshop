<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מעקב אופנועים — הסדנה</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --border: #ddd;
      --accent: #e85d04;
      --text: #1a1a1a;
      --muted: #666;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: #1a1a1a;
      color: #fff;
      padding: 20px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p  { font-size: 0.78rem; color: #aaa; margin-top: 2px; }

    #add-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #sync-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      margin-left: 6px;
      vertical-align: middle;
    }
    #sync-dot.syncing { background: #f59e0b; }
    #sync-dot.error   { background: #ef4444; }

    .filter-bar {
      padding: 14px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .filter-bar button {
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      color: var(--muted);
      transition: all 0.15s;
    }

    .filter-bar button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-photo {
      width: 100%;
      height: 180px;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card-photo img { width: 100%; height: 100%; object-fit: cover; }

    .photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #aaa;
      font-size: 0.8rem;
    }

    .photo-placeholder svg { width: 36px; height: 36px; opacity: 0.5; }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card-photo:hover .photo-overlay { opacity: 1; }

    .photo-overlay span {
      color: #fff;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .photo-uploading {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.85rem;
      gap: 8px;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .card-badges {
      padding: 10px 14px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 4px;
      padding: 3px 8px;
    }

    .badge-own   { background: #dbeafe; color: #1d4ed8; }
    .badge-other { background: #fef3c7; color: #92400e; }

    .badge-test-yes { background: #d1fae5; color: #065f46; }
    .badge-test-no  { background: #fee2e2; color: #991b1b; }
    .badge-test-na  { background: #f3f4f6; color: #6b7280; }

    .badge-status          { background: #f3f4f6; color: #374151; }
    .badge-status.waiting  { background: #fef9c3; color: #713f12; }
    .badge-status.ready    { background: #d1fae5; color: #065f46; }
    .badge-status.inwork   { background: #e0e7ff; color: #3730a3; }

    .card-body {
      padding: 10px 14px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title { font-size: 1.05rem; font-weight: 700; }
    .card-year  { font-size: 0.82rem; color: var(--muted); }

    /* inline hours field */
    .card-stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
      margin-top: 2px;
    }

    .stat-box {
      background: #f9f9f9;
      border: 1.5px solid #eee;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .stat-box label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-box input[type=number] {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
      padding: 0;
    }

    .stat-box input[type=number]:focus { outline: none; color: var(--accent); }

    /* parts list on card */
    .parts-section {
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
      margin-top: 2px;
    }

    .parts-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .parts-list-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .part-row-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.83rem;
      color: #444;
    }

    .part-row-card .part-cost-card {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      margin-right: 8px;
    }

    .parts-total {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 700;
      border-top: 1px solid #eee;
      margin-top: 6px;
      padding-top: 6px;
      color: var(--accent);
    }

    .card-notes {
      font-size: 0.85rem;
      color: #444;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
      margin-top: 4px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .card-actions button {
      flex: 1;
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 6px;
      padding: 7px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
    }

    .card-actions button:hover { background: #f5f5f5; }
    .card-actions .btn-del { color: #e53e3e; border-color: #fecaca; }
    .card-actions .btn-del:hover { background: #fef2f2; }

    #empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    #empty svg { width: 56px; opacity: 0.25; margin-bottom: 12px; }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    @media (min-width: 600px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }

    .modal {
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 24px 20px 32px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
    }

    @media (min-width: 600px) {
      .modal { border-radius: 16px; }
    }

    .modal h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; }

    .form-row { margin-bottom: 14px; }

    .form-row label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      appearance: none;
      -webkit-appearance: none;
    }

    .form-row textarea { resize: vertical; min-height: 90px; }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .photo-upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .photo-upload-area img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #aaa;
      font-size: 0.82rem;
      pointer-events: none;
      position: relative;
      z-index: 1;
    }

    .photo-upload-label svg { width: 30px; opacity: 0.5; }

    /* parts in modal */
    .parts-modal-section {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .parts-modal-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .part-row-modal {
      display: grid;
      grid-template-columns: 1fr 100px 32px;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .part-row-modal input {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.88rem;
      font-family: inherit;
    }

    .part-row-modal input:focus { outline: none; border-color: var(--accent); }

    .btn-remove-part {
      background: #fef2f2;
      border: none;
      border-radius: 6px;
      color: #e53e3e;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      height: 32px;
      width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .parts-modal-total {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);
      text-align: left;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }

    .btn-add-part {
      background: #f0f9ff;
      border: 1.5px dashed #93c5fd;
      border-radius: 6px;
      color: #2563eb;
      font-size: 0.83rem;
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }

    .btn-add-part:hover { background: #e0f2fe; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .btn-save   { background: var(--accent); color: #fff; }
    .btn-cancel { background: #f0f0f0; color: var(--text); }

    .hidden { display: none !important; }

    /* section divider in modal */
    .modal-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 18px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🔧 הסדנה — מעקב אופנועים <span id="sync-dot"></span></h1>
    <p id="count-label">מתחבר...</p>
  </div>
  <button id="add-btn">+ הוסף</button>
</header>

<div class="filter-bar">
  <button class="active" data-filter="all">הכל</button>
  <button data-filter="inwork">בעבודה</button>
  <button data-filter="waiting">ממתין לחלקים</button>
  <button data-filter="ready">מוכן</button>
  <button data-filter="own">שלנו</button>
  <button data-filter="other">של לקוח</button>
</div>

<div id="grid"></div>

<!-- Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2 id="modal-title">אופנוע חדש</h2>

    <p class="modal-section-label">פרטי הכלי</p>

    <div class="form-two-col">
      <div class="form-row">
        <label>יצרן</label>
        <select id="f-make" onchange="onMakeChange()">
          <option value="">בחר יצרן...</option>
        </select>
      </div>
      <div class="form-row">
        <label>דגם</label>
        <select id="f-model-select">
          <option value="">בחר דגם...</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label>דגם מדויק / שם מותאם אישית</label>
      <input type="text" id="f-model" placeholder="לדוגמה: CB500F ABS 2019 — אפשר לערוך חופשי" />
    </div>

    <div class="form-row">
      <label>שנה</label>
      <input type="number" id="f-year" placeholder="2010" min="1940" max="2030" />
    </div>

    <div class="form-two-col">
      <div class="form-row">
        <label>סטטוס</label>
        <select id="f-status">
          <option value="inwork">בעבודה</option>
          <option value="waiting">ממתין לחלקים</option>
          <option value="ready">מוכן</option>
          <option value="other">אחר</option>
        </select>
      </div>
      <div class="form-row">
        <label>בעלות</label>
        <select id="f-owner">
          <option value="own">שלנו</option>
          <option value="other">של לקוח</option>
        </select>
      </div>
    </div>

    <div class="form-two-col">
      <div class="form-row">
        <label>טסט</label>
        <select id="f-test">
          <option value="yes">יש טסט תקף</option>
          <option value="no">אין טסט</option>
          <option value="na">לא רלוונטי</option>
        </select>
      </div>
      <div class="form-row">
        <label>⏱ שעות עבודה</label>
        <input type="number" id="f-hours" placeholder="0" min="0" step="0.5" />
      </div>
    </div>

    <div class="form-row">
      <label>תמונה</label>
      <div class="photo-upload-area" id="photo-area">
        <div class="photo-upload-label" id="photo-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 16l4-4 4 4 4-6 4 6"/>
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
          <span>לחץ לבחירת תמונה</span>
        </div>
      </div>
      <input type="file" id="f-photo" accept="image/*" class="hidden" />
    </div>

    <p class="modal-section-label">🔩 חלקי חילוף</p>

    <div class="parts-modal-section">
      <div id="parts-list-modal"></div>
      <button class="btn-add-part" id="add-part-btn">+ הוסף חלק</button>
      <div class="parts-modal-total" id="parts-modal-total"></div>
    </div>

    <div class="form-row">
      <label>פירוט חופשי</label>
      <textarea id="f-notes" placeholder="תיאור עבודה, הערות..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="cancel-btn">ביטול</button>
      <button class="btn-save" id="save-btn">שמור</button>
    </div>
  </div>
</div>

<input type="file" id="card-photo-input" accept="image/*" class="hidden" />

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  storageBucket: "eitan-workshop.firebasestorage.app",
  messagingSenderId: "990271100135",
  appId: "1:990271100135:web:7cac98741920918b7b7e42"
};

firebase.initializeApp(firebaseConfig);
const db      = firebase.firestore();
const storage = firebase.storage();
const col     = db.collection('bikes');

// ── State ─────────────────────────────────────────────────
let bikes = [];
let editingId = null;
let pendingPhotoFile = null;
let pendingPhotoCardId = null;
let modalParts = []; // [{name, cost}]

// ── Populate make dropdown ────────────────────────────────
const makeSelect = document.getElementById('f-make');
Object.keys(MOTO_DB).sort().forEach(make => {
  const opt = document.createElement('option');
  opt.value = make; opt.textContent = make;
  makeSelect.appendChild(opt);
});

function onMakeChange() {
  const make = document.getElementById('f-make').value;
  const modelSelect = document.getElementById('f-model-select');
  modelSelect.innerHTML = '<option value="">בחר דגם...</option>';
  if (make && MOTO_DB[make]) {
    MOTO_DB[make].forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      modelSelect.appendChild(opt);
    });
  }
  // auto-fill text field when model selected
  modelSelect.onchange = () => {
    if (modelSelect.value) {
      document.getElementById('f-model').value = make + ' ' + modelSelect.value;
    }
  };
}

// ── Sync dot ──────────────────────────────────────────────
function setSyncDot(state) {
  const dot = document.getElementById('sync-dot');
  dot.className = state === 'ok' ? '' : state;
}

// ── Real-time listener ────────────────────────────────────
col.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
  bikes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  setSyncDot('ok');
  render();
}, err => { console.error(err); setSyncDot('error'); });

// ── Upload photo ──────────────────────────────────────────
async function uploadPhoto(file, bikeId) {
  const ref = storage.ref(`bikes/${bikeId}/${Date.now()}_${file.name}`);
  await ref.put(file);
  return await ref.getDownloadURL();
}

// ── Render ────────────────────────────────────────────────
let currentFilter = 'all';

function render() {
  const grid = document.getElementById('grid');
  const filtered = bikes.filter(b => {
    if (currentFilter === 'all')   return true;
    if (currentFilter === 'own')   return b.owner === 'own';
    if (currentFilter === 'other') return b.owner === 'other';
    return b.status === currentFilter;
  });

  const total = bikes.length;
  document.getElementById('count-label').textContent =
    total === 0 ? 'אין אופנועים עדיין' : `${total} אופנוע${total !== 1 ? 'ים' : ''}`;

  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = `<div id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/>
      </svg>
      <p>אין אופנועים להצגה בסינון הנוכחי.</p>
    </div>`;
    return;
  }

  const statusLabel = { inwork: 'בעבודה', waiting: 'ממתין לחלקים', ready: 'מוכן', other: 'אחר' };
  const statusClass = { inwork: 'inwork', waiting: 'waiting', ready: 'ready', other: '' };
  const testLabel   = { yes: '✓ טסט תקף', no: '✗ אין טסט', na: 'טסט N/A' };
  const testClass   = { yes: 'badge-test-yes', no: 'badge-test-no', na: 'badge-test-na' };

  filtered.forEach(b => {
    const parts = b.parts || [];
    const partsTotal = parts.reduce((s, p) => s + (Number(p.cost) || 0), 0);

    const partsHTML = parts.length > 0 ? `
      <div class="parts-section">
        <div class="parts-section-title">🔩 חלקי חילוף</div>
        <div class="parts-list-card">
          ${parts.map(p => `
            <div class="part-row-card">
              <span>${escHtml(p.name)}</span>
              <span class="part-cost-card">₪${Number(p.cost || 0).toLocaleString()}</span>
            </div>`).join('')}
        </div>
        <div class="parts-total">
          <span>סה"כ חלקים</span>
          <span>₪${partsTotal.toLocaleString()}</span>
        </div>
      </div>` : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-photo" data-id="${b.id}" data-action="photo">
        ${b.photo
          ? `<img src="${b.photo}" alt="${escHtml(b.model || '')}" />`
          : `<div class="photo-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              <span>הוסף תמונה</span>
            </div>`}
        <div class="photo-overlay"><span>החלף תמונה</span></div>
      </div>
      <div class="card-badges">
        <span class="badge ${b.owner === 'own' ? 'badge-own' : 'badge-other'}">${b.owner === 'own' ? 'שלנו' : 'של לקוח'}</span>
        <span class="badge badge-status ${statusClass[b.status] || ''}">${statusLabel[b.status] || b.status}</span>
        <span class="badge ${testClass[b.test] || 'badge-test-na'}">${testLabel[b.test] || ''}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(b.model || '(ללא שם)')}</div>
        ${b.year ? `<div class="card-year">שנה: ${b.year}</div>` : ''}
        <div class="card-stats">
          <div class="stat-box">
            <label>⏱ שעות עבודה</label>
            <input type="number" min="0" step="0.5"
              value="${b.hours || ''}"
              placeholder="0"
              data-id="${b.id}" data-field="hours"
              onchange="updateField(this)" />
          </div>
        </div>
        ${partsHTML}
        ${b.notes ? `<div class="card-notes">${escHtml(b.notes)}</div>` : ''}
        <div class="card-actions">
          <button data-id="${b.id}" data-action="edit">✏️ עריכה</button>
          <button class="btn-del" data-id="${b.id}" data-action="delete">🗑 מחק</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Filter ────────────────────────────────────────────────
document.querySelectorAll('.filter-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

// ── Grid click delegation ─────────────────────────────────
document.getElementById('grid').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { id, action } = btn.dataset;
  if (action === 'edit')   openModal(id);
  if (action === 'delete') deleteBike(id);
  if (action === 'photo')  openCardPhoto(id);
});

// ── Parts in modal ────────────────────────────────────────
function renderModalParts() {
  const list = document.getElementById('parts-list-modal');
  list.innerHTML = '';
  modalParts.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'part-row-modal';
    row.innerHTML = `
      <input type="text" placeholder="שם החלק" value="${escHtml(p.name)}"
        oninput="modalParts[${i}].name = this.value" />
      <input type="number" placeholder="מחיר ₪" value="${p.cost || ''}" min="0"
        oninput="modalParts[${i}].cost = Number(this.value); updatePartsTotal()" />
      <button class="btn-remove-part" onclick="removePart(${i})">✕</button>`;
    list.appendChild(row);
  });
  updatePartsTotal();
}

function updatePartsTotal() {
  const total = modalParts.reduce((s, p) => s + (Number(p.cost) || 0), 0);
  const el = document.getElementById('parts-modal-total');
  el.textContent = modalParts.length > 0 ? `סה"כ: ₪${total.toLocaleString()}` : '';
}

function removePart(i) {
  modalParts.splice(i, 1);
  renderModalParts();
}

document.getElementById('add-part-btn').addEventListener('click', () => {
  modalParts.push({ name: '', cost: 0 });
  renderModalParts();
});

// ── Modal ─────────────────────────────────────────────────
const modal = document.getElementById('modal');

function openModal(id) {
  editingId = id || null;
  pendingPhotoFile = null;
  document.getElementById('modal-title').textContent = id ? 'עריכת אופנוע' : 'אופנוע חדש';
  const b = id ? bikes.find(x => x.id === id) : null;

  // reset make/model dropdowns
  document.getElementById('f-make').value = '';
  document.getElementById('f-model-select').innerHTML = '<option value="">בחר דגם...</option>';

  document.getElementById('f-model').value  = b?.model  || '';
  document.getElementById('f-year').value   = b?.year   || '';
  document.getElementById('f-status').value = b?.status || 'inwork';
  document.getElementById('f-owner').value  = b?.owner  || 'own';
  document.getElementById('f-test').value   = b?.test   || 'na';
  document.getElementById('f-hours').value  = b?.hours  || '';
  document.getElementById('f-notes').value  = b?.notes  || '';

  // parts
  modalParts = (b?.parts || []).map(p => ({ ...p }));
  renderModalParts();

  const area = document.getElementById('photo-area');
  const oldImg = area.querySelector('img');
  if (oldImg) oldImg.remove();
  if (b?.photo) {
    const img = document.createElement('img');
    img.src = b.photo;
    area.insertBefore(img, area.firstChild);
    document.getElementById('photo-label').style.display = 'none';
  } else {
    document.getElementById('photo-label').style.display = '';
  }

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
  editingId = null;
  pendingPhotoFile = null;
  modalParts = [];
  document.getElementById('f-photo').value = '';
}

document.getElementById('add-btn').addEventListener('click', () => openModal(null));
document.getElementById('cancel-btn').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

document.getElementById('photo-area').addEventListener('click', () => {
  document.getElementById('f-photo').click();
});

document.getElementById('f-photo').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  pendingPhotoFile = file;
  const area = document.getElementById('photo-area');
  let img = area.querySelector('img');
  if (!img) { img = document.createElement('img'); area.insertBefore(img, area.firstChild); }
  img.src = URL.createObjectURL(file);
  document.getElementById('photo-label').style.display = 'none';
});

// ── Save ──────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', async () => {
  const model = document.getElementById('f-model').value.trim();
  if (!model) { document.getElementById('f-model').focus(); return; }

  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'שומר...';
  setSyncDot('syncing');

  try {
    const docId = editingId || col.doc().id;
    let photoURL = null;

    if (pendingPhotoFile) {
      photoURL = await uploadPhoto(pendingPhotoFile, docId);
    } else if (editingId) {
      photoURL = bikes.find(b => b.id === editingId)?.photo || null;
    }

    // clean parts — remove empty rows
    const cleanParts = modalParts
      .filter(p => p.name.trim() || p.cost)
      .map(p => ({ name: p.name.trim(), cost: Number(p.cost) || 0 }));

    const data = {
      model,
      year:      document.getElementById('f-year').value.trim(),
      status:    document.getElementById('f-status').value,
      owner:     document.getElementById('f-owner').value,
      test:      document.getElementById('f-test').value,
      hours:     Number(document.getElementById('f-hours').value) || null,
      notes:     document.getElementById('f-notes').value.trim(),
      parts:     cleanParts,
      photo:     photoURL,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };

    if (!editingId) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();

    await col.doc(docId).set(data, { merge: true });
    closeModal();
  } catch (err) {
    console.error(err);
    alert('שגיאה בשמירה: ' + err.message);
    setSyncDot('error');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'שמור';
  }
});

// ── Inline field update (hours) ───────────────────────────
async function updateField(input) {
  const id    = input.dataset.id;
  const field = input.dataset.field;
  const value = input.value === '' ? null : Number(input.value);
  try {
    await col.doc(id).update({ [field]: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  } catch (err) {
    alert('Error saving: ' + err.message);
  }
}

// ── Per-card photo ─────────────────────────────────────────
function openCardPhoto(id) {
  pendingPhotoCardId = id;
  document.getElementById('card-photo-input').click();
}

document.getElementById('card-photo-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !pendingPhotoCardId) return;
  const id = pendingPhotoCardId;
  pendingPhotoCardId = null;
  e.target.value = '';

  const cardPhoto = document.querySelector(`.card-photo[data-id="${id}"]`);
  if (cardPhoto) {
    const spinner = document.createElement('div');
    spinner.className = 'photo-uploading';
    spinner.innerHTML = '<div class="spinner"></div><span>מעלה...</span>';
    cardPhoto.appendChild(spinner);
  }

  try {
    const url = await uploadPhoto(file, id);
    await col.doc(id).update({ photo: url, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  } catch (err) {
    alert('שגיאה בהעלאת תמונה: ' + err.message);
  }
});

// ── Delete ─────────────────────────────────────────────────
async function deleteBike(id) {
  const b = bikes.find(x => x.id === id);
  if (!b || !confirm(`למחוק את "${b.model}"?`)) return;
  try {
    await col.doc(id).delete();
  } catch (err) {
    alert('שגיאה במחיקה: ' + err.message);
  }
}
</script>
</body>
</html>
