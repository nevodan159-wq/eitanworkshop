<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מעקב אופנועים — הסדנה</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 20px;
      padding: 24px;
    }

    #login-screen h2 {
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
    }

    #login-screen p {
      color: #aaa;
      font-size: 0.85rem;
      text-align: center;
      margin-top: -10px;
    }

    #login-box {
      background: #2a2a2a;
      border-radius: 14px;
      padding: 28px 24px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #login-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1.5px solid #444;
      background: #1a1a1a;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      letter-spacing: 2px;
      text-align: center;
    }

    #login-box input:focus { outline: none; border-color: #e85d04; }

    #login-btn {
      background: #e85d04;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    #login-error {
      color: #f87171;
      font-size: 0.82rem;
      text-align: center;
      min-height: 18px;
    }

    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --border: #ddd;
      --accent: #e85d04;
      --text: #1a1a1a;
      --muted: #666;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --green: #16a34a;
      --red: #dc2626;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: #1a1a1a;
      color: #fff;
      padding: 20px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p  { font-size: 0.78rem; color: #aaa; margin-top: 2px; }

    #add-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #sync-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      margin-left: 6px;
      vertical-align: middle;
    }
    #sync-dot.syncing { background: #f59e0b; }
    #sync-dot.error   { background: #ef4444; }

    /* ── DASHBOARD ── */
    .dashboard {
      background: #111;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border-bottom: 1px solid #333;
    }

    @media (max-width: 500px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); }
    }

    .dash-tile {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }

    .dash-tile .dash-label {
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .dash-tile .dash-value {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
    }

    .dash-tile .dash-value.profit  { color: #4ade80; }
    .dash-tile .dash-value.loss    { color: #f87171; }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 14px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .filter-bar button {
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      color: var(--muted);
      transition: all 0.15s;
    }

    .filter-bar button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ── GRID ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-photo {
      width: 100%;
      height: 180px;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card-photo img { width: 100%; height: 100%; object-fit: cover; }

    .photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #aaa;
      font-size: 0.8rem;
    }

    .photo-placeholder svg { width: 36px; height: 36px; opacity: 0.5; }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card-photo:hover .photo-overlay { opacity: 1; }

    .photo-overlay span {
      color: #fff;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .photo-uploading {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.85rem;
      gap: 8px;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .card-badges {
      padding: 10px 14px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 4px;
      padding: 3px 8px;
    }

    .badge-own   { background: #dbeafe; color: #1d4ed8; }
    .badge-other { background: #fef3c7; color: #92400e; }

    .badge-test-yes { background: #d1fae5; color: #065f46; }
    .badge-test-no  { background: #fee2e2; color: #991b1b; }
    .badge-test-na  { background: #f3f4f6; color: #6b7280; }

    .badge-status          { background: #f3f4f6; color: #374151; }
    .badge-status.waiting  { background: #fef9c3; color: #713f12; }
    .badge-status.ready    { background: #d1fae5; color: #065f46; }
    .badge-status.inwork   { background: #e0e7ff; color: #3730a3; }
    .badge-status.sold     { background: #d1fae5; color: #065f46; }

    .card-body {
      padding: 10px 14px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title { font-size: 1.05rem; font-weight: 700; }
    .card-year  { font-size: 0.82rem; color: var(--muted); }

    .card-customer {
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* inline hours */
    .card-stats {
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
      margin-top: 2px;
    }

    .stat-box {
      background: #f9f9f9;
      border: 1.5px solid #eee;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .stat-box label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-box input[type=number] {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
      padding: 0;
    }

    .stat-box input[type=number]:focus { outline: none; color: var(--accent); }

    /* finance section on card */
    .finance-section {
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
      margin-top: 2px;
    }

    .finance-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .finance-rows { display: flex; flex-direction: column; gap: 4px; }

    .finance-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #555;
    }

    .finance-row.total-row {
      font-weight: 700;
      font-size: 0.88rem;
      border-top: 1px solid #eee;
      padding-top: 5px;
      margin-top: 2px;
    }

    .finance-row.profit-row { color: var(--green); font-weight: 800; }
    .finance-row.loss-row   { color: var(--red);   font-weight: 800; }

    /* parts on card */
    .parts-section {
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
      margin-top: 2px;
    }

    .parts-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .parts-list-card { display: flex; flex-direction: column; gap: 4px; }

    .part-row-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.83rem;
      color: #444;
    }

    .part-cost-card {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      margin-right: 8px;
    }

    .parts-total {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      border-top: 1px solid #eee;
      margin-top: 5px;
      padding-top: 5px;
      color: #374151;
    }

    .card-notes {
      font-size: 0.85rem;
      color: #444;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
      margin-top: 4px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .card-actions button {
      flex: 1;
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 6px;
      padding: 7px;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--muted);
      white-space: nowrap;
    }

    .card-actions button:hover { background: #f5f5f5; }
    .card-actions .btn-del { color: #e53e3e; border-color: #fecaca; }
    .card-actions .btn-del:hover { background: #fef2f2; }
    .card-actions .btn-pdf { color: #2563eb; border-color: #bfdbfe; }
    .card-actions .btn-pdf:hover { background: #eff6ff; }

    #empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    #empty svg { width: 56px; opacity: 0.25; margin-bottom: 12px; }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    @media (min-width: 600px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }

    .modal {
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 24px 20px 32px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
    }

    @media (min-width: 600px) { .modal { border-radius: 16px; } }

    .modal h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; }

    .modal-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 18px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eee;
    }

    .form-row { margin-bottom: 14px; }

    .form-row label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      appearance: none;
      -webkit-appearance: none;
    }

    .form-row textarea { resize: vertical; min-height: 90px; }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus { outline: none; border-color: var(--accent); }

    .form-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .photo-upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .photo-upload-area img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .photo-upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #aaa;
      font-size: 0.82rem;
      pointer-events: none;
      position: relative;
      z-index: 1;
    }

    .photo-upload-label svg { width: 30px; opacity: 0.5; }

    /* parts in modal */
    .parts-modal-section {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .part-row-modal {
      display: grid;
      grid-template-columns: 1fr 100px 32px;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .part-row-modal input {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.88rem;
      font-family: inherit;
    }

    .part-row-modal input:focus { outline: none; border-color: var(--accent); }

    .btn-remove-part {
      background: #fef2f2;
      border: none;
      border-radius: 6px;
      color: #e53e3e;
      font-size: 1rem;
      cursor: pointer;
      height: 32px; width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .parts-modal-total {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);
      text-align: left;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }

    .btn-add-part {
      background: #f0f9ff;
      border: 1.5px dashed #93c5fd;
      border-radius: 6px;
      color: #2563eb;
      font-size: 0.83rem;
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }

    .btn-add-part:hover { background: #e0f2fe; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .btn-save   { background: var(--accent); color: #fff; }
    .btn-cancel { background: #f0f0f0; color: var(--text); }

    .hidden { display: none !important; }

    /* ── PRINT / PDF ── */
    #print-area { display: none; }

    @media print {
      body > *       { display: none !important; }
      #print-area    { display: block !important; }

      #print-area {
        font-family: Arial, sans-serif;
        padding: 30px;
        color: #000;
        direction: rtl;
      }

      .print-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #000;
        padding-bottom: 12px;
        margin-bottom: 20px;
      }

      .print-header h1 { font-size: 1.4rem; margin-bottom: 4px; }
      .print-header p  { font-size: 0.85rem; color: #555; }

      .print-photo {
        width: 180px;
        height: 130px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #ddd;
      }

      .print-section { margin-bottom: 16px; }
      .print-section h3 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #555;
        border-bottom: 1px solid #eee;
        padding-bottom: 4px;
        margin-bottom: 8px;
      }

      .print-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 20px;
      }

      .print-field { font-size: 0.88rem; }
      .print-field span { font-weight: 600; }

      .print-parts table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      .print-parts th, .print-parts td {
        border: 1px solid #ddd;
        padding: 5px 8px;
        text-align: right;
      }

      .print-parts th { background: #f5f5f5; font-weight: 700; }

      .print-finance {
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
      }

      .print-finance-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.88rem;
        padding: 3px 0;
      }

      .print-finance-row.profit { color: #16a34a; font-weight: 800; font-size: 1rem; }
      .print-finance-row.loss   { color: #dc2626; font-weight: 800; font-size: 1rem; }

      .print-notes {
        white-space: pre-wrap;
        font-size: 0.85rem;
        line-height: 1.5;
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 4px;
        padding: 8px 10px;
      }

      .print-footer {
        margin-top: 30px;
        font-size: 0.75rem;
        color: #aaa;
        text-align: center;
        border-top: 1px solid #eee;
        padding-top: 10px;
      }
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <h2>🔧 הסדנה</h2>
  <p>מעקב אופנועים</p>
  <div id="login-box">
    <input type="password" id="login-input" placeholder="סיסמא" onkeydown="if(event.key==='Enter')doLogin()" />
    <button id="login-btn" onclick="doLogin()">כניסה</button>
    <div id="login-error"></div>
  </div>
</div>

<header>
  <div>
    <h1>🔧 הסדנה — מעקב אופנועים <span id="sync-dot"></span></h1>
    <p id="count-label">מתחבר...</p>
  </div>
  <button id="add-btn">+ הוסף</button>
</header>

<!-- Dashboard -->
<div class="dashboard">
  <div class="dash-tile">
    <div class="dash-label">כלי פעילים</div>
    <div class="dash-value" id="d-active">—</div>
  </div>
  <div class="dash-tile">
    <div class="dash-label">סה"כ השקעה</div>
    <div class="dash-value" id="d-invested">—</div>
  </div>
  <div class="dash-tile">
    <div class="dash-label">סה"כ הכנסות</div>
    <div class="dash-value" id="d-income">—</div>
  </div>
  <div class="dash-tile">
    <div class="dash-label">רווח / הפסד</div>
    <div class="dash-value" id="d-profit">—</div>
  </div>
</div>

<div class="filter-bar">
  <button class="active" data-filter="all">הכל</button>
  <button data-filter="inwork">בעבודה</button>
  <button data-filter="waiting">ממתין לחלקים</button>
  <button data-filter="ready">מוכן</button>
  <button data-filter="sold">נמכר</button>
  <button data-filter="own">שלנו</button>
  <button data-filter="other">של לקוח</button>
</div>

<div id="grid"></div>

<!-- Print area (hidden, shown only when printing) -->
<div id="print-area"></div>

<!-- Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2 id="modal-title">אופנוע חדש</h2>

    <p class="modal-section-label">🏍 פרטי הכלי</p>

    <div class="form-two-col">
      <div class="form-row">
        <label>יצרן</label>
        <select id="f-make" onchange="onMakeChange()">
          <option value="">בחר יצרן...</option>

function setSyncDot(state) {

// ── Upload photo ─────────────────────────────────────────
async function uploadPhoto(file, bikeId) {
  const ref = storage.ref(`bikes/${bikeId}/${Date.now()}_${file.name}`);
  await ref.put(file);
  return await ref.getDownloadURL();
}

// ── Finance helpers ──────────────────────────────────────
function calcFinance(b) {
  const parts   = (b.parts || []).reduce((s, p) => s + (Number(p.cost) || 0), 0);
  const invested = (Number(b.buyPrice) || 0) + parts;
  const income   = (Number(b.repairIncome) || 0) + (Number(b.salePrice) || 0);
  const profit   = income - invested;
  return { parts, invested, income, profit };
}

// ── Dashboard ────────────────────────────────────────────
function updateDashboard() {
  const active   = bikes.filter(b => b.status !== 'sold').length;
  let totalInvested = 0, totalIncome = 0;
  bikes.forEach(b => {
    const f = calcFinance(b);
    totalInvested += f.invested;
    totalIncome   += f.income;
  });
  const totalProfit = totalIncome - totalInvested;

  document.getElementById('d-active').textContent   = active;
  document.getElementById('d-invested').textContent = '₪' + totalInvested.toLocaleString();
  document.getElementById('d-income').textContent   = '₪' + totalIncome.toLocaleString();

  const profEl = document.getElementById('d-profit');
  profEl.textContent = (totalProfit >= 0 ? '+' : '') + '₪' + totalProfit.toLocaleString();
  profEl.className = 'dash-value ' + (totalProfit >= 0 ? 'profit' : 'loss');
}

// ── Render ───────────────────────────────────────────────
let currentFilter = 'all';

function render() {
  updateDashboard();

  const grid = document.getElementById('grid');
  const filtered = bikes.filter(b => {
    if (currentFilter === 'all')   return true;
    if (currentFilter === 'own')   return b.owner === 'own';
    if (currentFilter === 'other') return b.owner === 'other';
    return b.status === currentFilter;
  });

  const total = bikes.length;
  document.getElementById('count-label').textContent =
    total === 0 ? 'אין אופנועים עדיין' : `${total} אופנוע${total !== 1 ? 'ים' : ''}`;

    </div>`;

  const testLabel   = { yes: '✓ טסט תקף', no: '✗ אין טסט', na: 'N/A' };
  const testClass   = { yes: 'badge-test-yes', no: 'badge-test-no', na: 'badge-test-na' };

  filtered.forEach(b => {
    const parts = b.parts || [];
    const partsTotal = parts.reduce((s, p) => s + (Number(p.cost) || 0), 0);
    const f = calcFinance(b);
    const hasFinance = b.buyPrice || b.repairIncome || b.salePrice || partsTotal > 0;

    const partsHTML = parts.length > 0 ? `
      <div class="parts-section">
        <div class="parts-section-title">🔩 חלקי חילוף</div>
        <div class="parts-list-card">
          ${parts.map(p => `
            <div class="part-row-card">
              <span>${escHtml(p.name)}</span>
              <span class="part-cost-card">₪${Number(p.cost||0).toLocaleString()}</span>
            </div>`).join('')}
        </div>
        <div class="parts-total">
          <span>סה"כ חלקים</span><span>₪${partsTotal.toLocaleString()}</span>
        </div>
      </div>` : '';

    const financeHTML = hasFinance ? `
      <div class="finance-section">
        <div class="finance-section-title">💰 כספים</div>
        <div class="finance-rows">
          ${b.buyPrice     ? `<div class="finance-row"><span>עלות רכישה</span><span>₪${Number(b.buyPrice).toLocaleString()}</span></div>` : ''}
          ${partsTotal > 0 ? `<div class="finance-row"><span>עלות חלקים</span><span>₪${partsTotal.toLocaleString()}</span></div>` : ''}
          ${b.repairIncome ? `<div class="finance-row"><span>תשלום תיקון</span><span>₪${Number(b.repairIncome).toLocaleString()}</span></div>` : ''}
          ${b.salePrice    ? `<div class="finance-row"><span>מחיר מכירה</span><span>₪${Number(b.salePrice).toLocaleString()}</span></div>` : ''}
          <div class="finance-row total-row"><span>השקעה כוללת</span><span>₪${f.invested.toLocaleString()}</span></div>
          <div class="finance-row ${f.profit >= 0 ? 'profit-row' : 'loss-row'}">
            <span>${f.profit >= 0 ? '✓ רווח' : '✗ הפסד'}</span>
            <span>${f.profit >= 0 ? '+' : ''}₪${f.profit.toLocaleString()}</span>
          </div>
        </div>
      </div>` : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-photo" data-id="${b.id}" data-action="photo">
        ${b.photo
          ? `<img src="${b.photo}" alt="${escHtml(b.model||'')}" />`
          : `<div class="photo-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              <span>הוסף תמונה</span>
            </div>`}
        <div class="photo-overlay"><span>החלף תמונה</span></div>
      </div>
      <div class="card-badges">
        <span class="badge ${b.owner==='own'?'badge-own':'badge-other'}">${b.owner==='own'?'שלנו':'של לקוח'}</span>
        <span class="badge badge-status ${statusClass[b.status]||''}">${statusLabel[b.status]||b.status}</span>
        <span class="badge ${testClass[b.test]||'badge-test-na'}">${testLabel[b.test]||''}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(b.model||'(ללא שם)')}</div>
        ${b.year ? `<div class="card-year">שנה: ${b.year}</div>` : ''}
        ${b.customerName||b.customerPhone ? `
          <div class="card-customer">
            👤 ${b.customerName ? escHtml(b.customerName) : ''}

            <input type="number" min="0" step="0.5"
              value="${b.hours||''}" placeholder="0"
              data-id="${b.id}" data-field="hours"
              onchange="updateField(this)" />

        ${b.notes ? `<div class="card-notes">${escHtml(b.notes)}</div>` : ''}

        </div>
      </div>`;
    grid.appendChild(card);

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Filter ───────────────────────────────────────────────

    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

// ── Grid delegation ──────────────────────────────────────
document.getElementById('grid').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');

  const { id, action } = btn.dataset;

  if (action === 'delete') deleteBike(id);
  if (action === 'photo')  openCardPhoto(id);
  if (action === 'pdf')    printBike(id);
});

// ── Parts in modal ───────────────────────────────────────
function renderModalParts() {
  const list = document.getElementById('parts-list-modal');
  list.innerHTML = '';
  modalParts.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'part-row-modal';
    row.innerHTML = `
      <input type="text" placeholder="שם החלק" value="${escHtml(p.name)}"
        oninput="modalParts[${i}].name=this.value" />
      <input type="number" placeholder="מחיר ₪" value="${p.cost||''}" min="0"
        oninput="modalParts[${i}].cost=Number(this.value);updatePartsTotal()" />
      <button class="btn-remove-part" onclick="removePart(${i})">✕</button>`;
    list.appendChild(row);
  });
  updatePartsTotal();
}

function updatePartsTotal() {
  const total = modalParts.reduce((s, p) => s + (Number(p.cost)||0), 0);
  document.getElementById('parts-modal-total').textContent =
    modalParts.length > 0 ? `סה"כ: ₪${total.toLocaleString()}` : '';
}

function removePart(i) { modalParts.splice(i,1); renderModalParts(); }

document.getElementById('add-part-btn').addEventListener('click', () => {
  modalParts.push({ name:'', cost:0 });
  renderModalParts();
});

// ── Modal ────────────────────────────────────────────────
const modal = document.getElementById('modal');

function openModal(id) {
  editingId = id || null;
  pendingPhotoFile = null;
  document.getElementById('modal-title').textContent = id ? 'עריכת אופנוע' : 'אופנוע חדש';
  const b = id ? bikes.find(x => x.id===id) : null;

  document.getElementById('f-make').value          = '';
  document.getElementById('f-model-select').innerHTML = '<option value="">בחר דגם...</option>';
  document.getElementById('f-model').value         = b?.model          || '';
  document.getElementById('f-year').value          = b?.year           || '';
  document.getElementById('f-status').value        = b?.status         || 'inwork';
  document.getElementById('f-owner').value         = b?.owner          || 'own';
  document.getElementById('f-test').value          = b?.test           || 'na';
  document.getElementById('f-hours').value         = b?.hours          || '';
  document.getElementById('f-customer-name').value = b?.customerName   || '';
  document.getElementById('f-customer-phone').value= b?.customerPhone  || '';
  document.getElementById('f-buy-price').value     = b?.buyPrice       || '';
  document.getElementById('f-repair-income').value = b?.repairIncome   || '';
  document.getElementById('f-sale-price').value    = b?.salePrice      || '';
  document.getElementById('f-notes').value         = b?.notes          || '';

  modalParts = (b?.parts||[]).map(p=>({...p}));
  renderModalParts();

  const area = document.getElementById('photo-area');
  const oldImg = area.querySelector('img');
  if (oldImg) oldImg.remove();
  if (b?.photo) {
    const img = document.createElement('img');
    img.src = b.photo;
    area.insertBefore(img, area.firstChild);
    document.getElementById('photo-label').style.display = 'none';
  } else {
    document.getElementById('photo-label').style.display = '';
  }

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
  editingId = null; pendingPhotoFile = null; modalParts = [];
  document.getElementById('f-photo').value = '';
}

document.getElementById('add-btn').addEventListener('click', () => openModal(null));
document.getElementById('cancel-btn').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target===modal) closeModal(); });

document.getElementById('photo-area').addEventListener('click', () => {
  document.getElementById('f-photo').click();
});

document.getElementById('f-photo').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  pendingPhotoFile = file;
  const area = document.getElementById('photo-area');
  let img = area.querySelector('img');
  if (!img) { img = document.createElement('img'); area.insertBefore(img, area.firstChild); }
  img.src = URL.createObjectURL(file);
  document.getElementById('photo-label').style.display = 'none';
});

// ── Save ─────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', async () => {
  const model = document.getElementById('f-model').value.trim();
  if (!model) { document.getElementById('f-model').focus(); return; }

  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true; saveBtn.textContent = 'שומר...';
  setSyncDot('syncing');

  try {
    const docId = editingId || col.doc().id;
    let photoURL = null;
    if (pendingPhotoFile) {
      photoURL = await uploadPhoto(pendingPhotoFile, docId);
    } else if (editingId) {
      photoURL = bikes.find(b=>b.id===editingId)?.photo || null;
    }

    const cleanParts = modalParts
      .filter(p => p.name.trim() || p.cost)
      .map(p => ({ name: p.name.trim(), cost: Number(p.cost)||0 }));

    const num = v => { const n = Number(v); return n || null; };

    const data = {
      model,
      year:          document.getElementById('f-year').value.trim(),
      status:        document.getElementById('f-status').value,
      owner:         document.getElementById('f-owner').value,
      test:          document.getElementById('f-test').value,
      hours:         num(document.getElementById('f-hours').value),
      customerName:  document.getElementById('f-customer-name').value.trim(),
      customerPhone: document.getElementById('f-customer-phone').value.trim(),
      buyPrice:      num(document.getElementById('f-buy-price').value),
      repairIncome:  num(document.getElementById('f-repair-income').value),
      salePrice:     num(document.getElementById('f-sale-price').value),
      notes:         document.getElementById('f-notes').value.trim(),
      parts:         cleanParts,
      photo:         photoURL,
      updatedAt:     firebase.firestore.FieldValue.serverTimestamp(),
    };
    if (!editingId) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();

    await col.doc(docId).set(data, { merge: true });
    closeModal();
  } catch (err) {
    console.error(err);
    alert('שגיאה בשמירה: ' + err.message);
    setSyncDot('error');
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = 'שמור';
  }
});

// ── Inline field update ──────────────────────────────────
async function updateField(input) {
  const id    = input.dataset.id;
  const field = input.dataset.field;
  const value = input.value === '' ? null : Number(input.value);
  try {
    await col.doc(id).update({ [field]: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  } catch (err) { alert('Error: ' + err.message); }
}

// ── Per-card photo ───────────────────────────────────────
function openCardPhoto(id) {
  pendingPhotoCardId = id;
  document.getElementById('card-photo-input').click();
}

document.getElementById('card-photo-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !pendingPhotoCardId) return;
  const id = pendingPhotoCardId; pendingPhotoCardId = null; e.target.value = '';
  const cardPhoto = document.querySelector(`.card-photo[data-id="${id}"]`);
  if (cardPhoto) {
    const sp = document.createElement('div');
    sp.className = 'photo-uploading';
    sp.innerHTML = '<div class="spinner"></div><span>מעלה...</span>';
    cardPhoto.appendChild(sp);
  }
  try {
    const url = await uploadPhoto(file, id);
    await col.doc(id).update({ photo: url, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  } catch (err) { alert('שגיאה: ' + err.message); }
});

// ── Delete ───────────────────────────────────────────────
async function deleteBike(id) {
  const b = bikes.find(x => x.id===id);
  if (!b || !confirm(`למחוק את "${b.model}"?`)) return;
  try { await col.doc(id).delete(); }
  catch (err) { alert('שגיאה: ' + err.message); }
}

// ── Print / PDF ──────────────────────────────────────────
function printBike(id) {
  const b = bikes.find(x => x.id===id);
  if (!b) return;
  const parts = b.parts || [];
  const partsTotal = parts.reduce((s,p) => s+(Number(p.cost)||0), 0);
  const f = calcFinance(b);

  const statusLabel = { inwork:'בעבודה', waiting:'ממתין לחלקים', ready:'מוכן', sold:'נמכר', other:'אחר' };
  const testLabel   = { yes:'יש טסט תקף', no:'אין טסט', na:'לא רלוונטי' };
  const now = new Date().toLocaleDateString('he-IL');

  const partsTable = parts.length > 0 ? `
    <div class="print-section print-parts">
      <h3>חלקי חילוף</h3>
      <table>
        <tr><th>חלק</th><th>מחיר</th></tr>
        ${parts.map(p=>`<tr><td>${escHtml(p.name)}</td><td>₪${Number(p.cost||0).toLocaleString()}</td></tr>`).join('')}
        <tr><td><strong>סה"כ</strong></td><td><strong>₪${partsTotal.toLocaleString()}</strong></td></tr>
      </table>
    </div>` : '';

  const financeHTML = `
    <div class="print-section">
      <h3>כספים</h3>
      <div class="print-finance">
        ${b.buyPrice     ? `<div class="print-finance-row"><span>עלות רכישה</span><span>₪${Number(b.buyPrice).toLocaleString()}</span></div>` : ''}
        ${partsTotal > 0 ? `<div class="print-finance-row"><span>עלות חלקים</span><span>₪${partsTotal.toLocaleString()}</span></div>` : ''}
        ${b.repairIncome ? `<div class="print-finance-row"><span>תשלום תיקון</span><span>₪${Number(b.repairIncome).toLocaleString()}</span></div>` : ''}
        ${b.salePrice    ? `<div class="print-finance-row"><span>מחיר מכירה</span><span>₪${Number(b.salePrice).toLocaleString()}</span></div>` : ''}
        <div class="print-finance-row"><span>השקעה כוללת</span><span>₪${f.invested.toLocaleString()}</span></div>
        <div class="print-finance-row ${f.profit>=0?'profit':'loss'}">
          <span>${f.profit>=0?'✓ רווח':'✗ הפסד'}</span>
          <span>${f.profit>=0?'+':''}₪${f.profit.toLocaleString()}</span>
        </div>
      </div>
    </div>`;

  document.getElementById('print-area').innerHTML = `
    <div class="print-header">
      <div>
        <h1>${escHtml(b.model||'אופנוע')}</h1>
        <p>שנה: ${b.year||'—'} &nbsp;|&nbsp; סטטוס: ${statusLabel[b.status]||b.status} &nbsp;|&nbsp; ${b.owner==='own'?'שלנו':'של לקוח'}</p>
        ${b.customerName||b.customerPhone ? `<p>לקוח: ${escHtml(b.customerName||'')} ${escHtml(b.customerPhone||'')}</p>` : ''}
        <p>טסט: ${testLabel[b.test]||'—'} &nbsp;|&nbsp; שעות עבודה: ${b.hours||0}</p>
      </div>
      ${b.photo ? `<img class="print-photo" src="${b.photo}" alt="תמונה" />` : ''}
    </div>
    ${financeHTML}
    ${partsTable}
    ${b.notes ? `<div class="print-section"><h3>הערות</h3><div class="print-notes">${escHtml(b.notes)}</div></div>` : ''}
    <div class="print-footer">הסדנה — מעקב אופנועים &nbsp;|&nbsp; הודפס: ${now}</div>`;

  window.print();
}
</script>
